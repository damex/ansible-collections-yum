---
argument_specs:
  main:
    options:
      yum_repositories:
        type: list
        elements: dict
        options:
          name:
            required: true
            type: str
          description:
            type: str
          file:
            type: str
          enabled:
            type: bool
          baseurl:
            type: str
          metalink:
            type: str
          mirrorlist:
            type: str
          gpgcheck:
            type: bool
          gpgkey:
            type: str
          state:
            type: str
            default: present
            choices:
              - absent
              - present
        required_one_of:
          - - baseurl
            - metalink
            - mirrorlist
        mutually_exclusive:
          - - baseurl
            - metalink
            - mirrorlist
